<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Monitores: dois monitores de tubo no estilo dos ícones do Window Maker
       (big-wm-themes), um em pé e o da frente com as setas de ajuste.
       SPDX-License-Identifier: GPL-2.0-or-later -->
  <title>Monitores</title>
  <defs>
    <linearGradient id="moldura" x1="6" y1="8" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".6" stop-color="#ececec"/>
      <stop offset="1" stop-color="#b4b4b4"/>
    </linearGradient>
    <linearGradient id="tela" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1680"/>
      <stop offset=".55" stop-color="#2434b4"/>
      <stop offset="1" stop-color="#5262dc"/>
    </linearGradient>
    <linearGradient id="pe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <ellipse cx="32" cy="57" rx="27" ry="3" fill="#000" fill-opacity=".35" filter="url(#sombra)"/>
  <!-- monitor de trás -->
  <path d="M38 38H46L47.5 41H36.5Z" fill="#a8a8a8"/>
  <ellipse cx="42" cy="42.2" rx="9" ry="2.2" fill="url(#pe)" stroke="#8a8a8a" stroke-width=".5"/>
  <rect x="27.5" y="7.5" width="31" height="31" rx="1.8" fill="url(#moldura)" stroke="#8a8a8a" stroke-width=".6"/>
  <path d="M28.5 37V9.4Q28.5 8.5 29.4 8.5H57.5" fill="none" stroke="#fff"/>
  <rect x="31" y="11" width="24" height="23" rx="1" fill="#9c9c9c"/>
  <rect x="32" y="12" width="22" height="21" rx=".8" fill="url(#tela)"/>
  <!-- monitor da frente -->
  <path d="M15 48.5H27L28.5 52.5H13.5Z" fill="#a8a8a8"/>
  <ellipse cx="21" cy="53.6" rx="12" ry="2.8" fill="url(#pe)" stroke="#8a8a8a" stroke-width=".5"/>
  <rect x="3.5" y="21.5" width="35" height="27" rx="1.8" fill="url(#moldura)" stroke="#8a8a8a" stroke-width=".6"/>
  <path d="M4.5 47V23.4Q4.5 22.5 5.4 22.5H37.5" fill="none" stroke="#fff"/>
  <rect x="7" y="25" width="28" height="19" rx="1" fill="#9c9c9c"/>
  <rect x="8" y="26" width="26" height="17" rx=".8" fill="url(#tela)"/>
  <path d="M9 27Q20 26.4 33 26.8V31Q20 29.6 9 32.5Z" fill="#fff" fill-opacity=".12"/>
  <!-- setas de ajuste de tamanho -->
  <g fill="none" stroke="#dfe4ff" stroke-width="1.5" stroke-linecap="square">
    <path d="M12 34.5H30"/>
    <path d="M14.5 32 12 34.5 14.5 37"/>
    <path d="M27.5 32 30 34.5 27.5 37"/>
  </g>
  <rect x="31" y="45.2" width="3" height="1.3" fill="#3ccc3c"/>
  <rect x="52" y="35.4" width="3" height="1.3" fill="#3ccc3c"/>
</svg>
